services:
  - type: web
    name: keili-assistant
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: FEISHU_APP_ID
        value: ""
      - key: FEISHU_APP_SECRET
        value: ""
      - key: FEISHU_SPREADSHEET_URL
        value: ""
      - key: FEISHU_CLASS_SHEETS
        value: "{}"
